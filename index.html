<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Inventory</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0c12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Inventory">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<h1>⚔ Shared Inventory</h1>
<p class="subtitle" id="syncStatus">Connecting…</p>
<div style="text-align:center;margin-bottom:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
  <button id="btnInstall" class="btn-ghost hidden" style="font-size:0.85rem">⬇ Инсталирай апа</button>
  <button class="btn-ghost" style="font-size:0.85rem" onclick="exportData()">💾 Export</button>
  <label class="btn-ghost" style="font-size:0.85rem;cursor:pointer;display:inline-flex;align-items:center;padding:7px 16px;border-radius:6px">📂 Import<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
</div>

<nav class="tab-nav">
  <button class="tab-btn active" data-tab="inventory">Инвентар</button>
  <button class="tab-btn" data-tab="quests">Куестове</button>
  <button class="tab-btn" data-tab="maps">Карти</button>
</nav>

<!-- ══════════════════════ INVENTORY TAB ══════════════════════ -->
<div id="tab-inventory" class="tab active">

  <div class="gold-section">
    <h3>💰 Хазна</h3>
    <div class="coin-grid">
      <div class="coin-cell"><div class="coin-label">Platinum</div><div class="coin-val pp" id="dispPP">0</div></div>
      <div class="coin-cell"><div class="coin-label">Gold</div><div class="coin-val gp" id="dispGP">0</div></div>
      <div class="coin-cell"><div class="coin-label">Silver</div><div class="coin-val sp" id="dispSP">0</div></div>
      <div class="coin-cell"><div class="coin-label">Copper</div><div class="coin-val cp" id="dispCP">0</div></div>
    </div>
    <div class="coin-inputs">
      <input id="inPP" type="number" min="0" step="1" placeholder="PP">
      <input id="inGP" type="number" min="0" step="1" placeholder="GP">
      <input id="inSP" type="number" min="0" step="1" placeholder="SP">
      <input id="inCP" type="number" min="0" step="1" placeholder="CP">
      <button class="btn-success btn-gain" onclick="handleGain()">Gain</button>
      <button class="btn-ghost btn-spend" onclick="handleSpend()">Spend</button>
    </div>
    <div class="gold-error" id="goldError">Недостатъчно средства!</div>
  </div>

  <div class="controls">
    <button class="btn-primary" onclick="openItemModal()">+ Добави предмет</button>
  </div>

  <div class="tbl-wrap">
    <table id="invTable">
      <thead>
        <tr>
          <th></th>
          <th>Предмет</th>
          <th>Кол.</th>
          <th>Тегло</th>
          <th>Стойност</th>
          <th>Носи</th>
          <th>Бележки</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="invBody"></tbody>
      <tfoot><tr class="tbl-footer"><td colspan="8" id="invFooter"></td></tr></tfoot>
    </table>
  </div>
</div>

<!-- ══════════════════════ QUESTS TAB ══════════════════════ -->
<div id="tab-quests" class="tab">

  <div class="controls">
    <button class="btn-primary" onclick="openQuestModal()">+ Добави куест</button>
  </div>

  <div class="tbl-wrap">
    <table id="questTable">
      <thead>
        <tr>
          <th></th>
          <th>Куест</th>
          <th>Статус</th>
          <th>Дадено от</th>
          <th>Награда</th>
          <th>Бележки</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="questBody"></tbody>
    </table>
  </div>
</div>

<!-- ══════════════════════ MAPS TAB ══════════════════════ -->
<div id="tab-maps" class="tab">

  <div class="controls">
    <button class="btn-primary" onclick="openMapModal()">+ Добави карта</button>
  </div>

  <div class="tbl-wrap">
    <table id="mapTable">
      <thead>
        <tr>
          <th></th>
          <th>Карта</th>
          <th>Детайли</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="mapBody"></tbody>
    </table>
  </div>
</div>

<!-- ══════════════════════ ITEM MODAL ══════════════════════ -->
<div class="modal" id="itemModal">
  <div class="modal-card">
    <div class="modal-title" id="itemModalTitle">Добави предмет</div>
    <div class="field"><label>Предмет *</label><input id="iName" type="text" placeholder="Меч / Въже / Зелие…"></div>
    <div class="field"><label>Категория</label>
      <select id="iCat">
        <option value="Разно">Разно</option>
        <option value="Оръжие">Оръжие</option>
        <option value="Броня">Броня</option>
        <option value="Консуматив">Консуматив</option>
      </select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
      <div class="field"><label>Количество</label><input id="iQty" type="number" min="0" value="1"></div>
      <div class="field"><label>Тегло (lb)</label><input id="iWeight" type="number" min="0" step="0.1" value="0"></div>
      <div class="field"><label>Стойност (gp)</label><input id="iValue" type="number" min="0" step="0.01" value="0"></div>
    </div>
    <div class="field"><label>Носи</label>
      <select id="iCarrier">
        <option value="Party">Party</option>
        <!-- PLAYERS populated by JS -->
      </select>
    </div>
    <div class="field"><label>Бележки</label><textarea id="iNote"></textarea></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeItemModal()">Отказ</button>
      <button class="btn-primary" onclick="saveItem()">Запази</button>
    </div>
  </div>
</div>

<!-- ══════════════════════ QUEST MODAL ══════════════════════ -->
<div class="modal" id="questModal">
  <div class="modal-card">
    <div class="modal-title" id="questModalTitle">Добави куест</div>
    <div class="field"><label>Куест *</label><input id="qName" type="text" placeholder="Убий дракона…"></div>
    <div class="field"><label>Статус</label>
      <select id="qStatus">
        <option value="Активен">Активен</option>
        <option value="Изпълнен">Изпълнен</option>
        <option value="Провален">Провален</option>
        <option value="Паузиран">Паузиран</option>
      </select>
    </div>
    <div class="field"><label>Дадено от</label><input id="qGiver" type="text" placeholder="NPC / Фракция…"></div>
    <div class="field"><label>Описание</label><textarea id="qDesc"></textarea></div>
    <div class="field"><label>Награда</label><input id="qReward" type="text" placeholder="500 XP, 50 GP…"></div>
    <div class="field"><label>Бележки</label><textarea id="qNote"></textarea></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeQuestModal()">Отказ</button>
      <button class="btn-primary" onclick="saveQuest()">Запази</button>
    </div>
  </div>
</div>

<div class="sync" id="sync">●  live</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
<!-- SortableJS -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<!-- Firebase SDK (CDN, no bundler needed) -->
<script type="module" src="./app.js"></script>
</body>
</html>
